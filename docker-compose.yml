services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: trivia
      POSTGRES_DB: trivia_showdown
    ports:
      - "5432:5432"
    volumes:
      - trivia_postgres_data:/var/lib/postgresql/data

volumes:
  trivia_postgres_data:
